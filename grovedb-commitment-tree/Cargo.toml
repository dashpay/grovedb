[package]
name = "grovedb-commitment-tree"
description = "Orchard-style commitment tree integration for GroveDB"
version = "4.0.0"
authors = ["Samuel Westrich <sam@dash.org>"]
edition = "2024"
license = "MIT"
homepage = "https://www.grovedb.org"
repository = "https://github.com/dashpay/grovedb"
readme = "../README.md"
documentation = "https://docs.rs/grovedb"

[features]
default = []
server = ["grovedb-storage", "grovedb-bulk-append-tree/storage"]
client = ["shardtree"]
sqlite = ["client", "rusqlite"]
# TEST / DEVNET ONLY — do not enable in production.
#
# Adds frontier-less seeding methods (`append_raw_without_frontier`,
# `append_many_without_frontier`) that populate the underlying BulkAppendTree
# WITHOUT updating the Sinsemilla frontier. This lets benchmarks pre-populate a
# shielded pool with a large N of filler notes at blake3 speed, skipping the
# per-note Pallas/Sinsemilla hashing. The resulting tree has NO valid Orchard
# anchor, so seeded notes are not spendable; chunk proofs (authenticated by the
# blake3 bulk state root) still verify, which is what client sync exercises.
test-seeding-ct = ["server"]

[dependencies]
orchard = { git = "https://github.com/dashpay/orchard.git", rev = "898258d76aab2822249492aede59a02d49278fff", features = ["circuit"] }
incrementalmerkletree = "0.8"
shardtree = { version = "0.6", optional = true }
rusqlite = { version = "0.38", features = ["bundled"], optional = true }
grovedb-costs = { version = "4.0.0", path = "../costs" }
grovedb-storage = { version = "4.0.0", path = "../storage", optional = true }
grovedb-bulk-append-tree = { version = "4.0.0", path = "../grovedb-bulk-append-tree", default-features = false }
blake3 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
rand = { workspace = true }
rand_core = "0.6"
# For the `seeding` benchmark: a real RocksDB-backed storage context.
grovedb-storage = { version = "4.0.0", path = "../storage", features = ["rocksdb_storage"] }
grovedb-path = { version = "4.0.0", path = "../path" }

[[bench]]
name = "verification"
harness = false

# Frontier-less seeding throughput (test/devnet only). Run with:
#   cargo bench -p grovedb-commitment-tree --bench seeding --features test-seeding-ct
[[bench]]
name = "seeding"
harness = false
