[package]
name = "grovedb-query"
version = "5.0.1"
edition = "2024"
license = "MIT"
description = "Query primitives for GroveDB"
homepage = "https://www.grovedb.org/"
documentation = "https://docs.rs/grovedb-query"
repository = "https://github.com/dashpay/grovedb"

[dependencies]
bincode = { workspace = true }
hex = { workspace = true }
indexmap = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, optional = true }
ed = { workspace = true }
byteorder = { workspace = true }
integer-encoding = { workspace = true }

# Feature-gated deps for merk integration
grovedb-costs = { version = "5.0.1", path = "../costs", optional = true }
grovedb-storage = { version = "5.0.1", path = "../storage", optional = true }



[dev-dependencies]
assert_matches = { workspace = true }
bincode = { workspace = true, features = ["serde"] }
indexmap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
serde_test = "1.0"

[features]
default = []
blockchain = ["grovedb-costs", "grovedb-storage"]
serde = ["dep:serde", "indexmap/serde"]
