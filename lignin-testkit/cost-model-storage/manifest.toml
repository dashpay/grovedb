# The manifest of the storage crate in the workspace `check.sh` lays out.
# It is not a `Cargo.toml` here, so that Cargo never takes this directory
# for a package of the real workspace.
[package]
name = "grovedb-storage"
version = "7.0.0"
edition = "2024"
license = "MIT"
description = "The LigninDB cost model, with the interface of grovedb-storage"
publish = false

[dependencies]
grovedb-costs = { version = "7.0.0", path = "../costs" }
grovedb-path = { version = "7.0.0", path = "../path" }
grovedb-visualize = { version = "7.0.0", path = "../visualize" }

blake3 = { workspace = true }
hex = { workspace = true }
strum = { version = "0.28.0", features = ["derive"] }
tempfile = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
integer-encoding = { workspace = true }

[features]
rocksdb_storage = []
unsafe-dump-load = []
