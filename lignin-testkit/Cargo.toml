[package]
name = "lignin-testkit"
description = "LigninDB test kit: workloads, golden corpus, differential fuzzer, crash simulation and benchmarks"
version = "6.1.1"
edition = "2024"
license = "MIT"
homepage = "https://www.grovedb.org"
repository = "https://github.com/dashpay/grovedb"
publish = false

[dependencies]
grovedb = { version = "6.1.1", path = "../grovedb" }
grovedb-costs = { version = "6.1.1", path = "../costs" }
grovedb-merk = { version = "6.1.1", path = "../merk" }
grovedb-version = { version = "6.1.1", path = "../grovedb-version" }
blake3 = { workspace = true }
hex = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
grovedb-commitment-tree = { version = "6.1.1", path = "../grovedb-commitment-tree" }
