[package]
name = "grovedb-bincode-derive"
version = "2.0.2"
authors = [
    "Zoey Riordan <zoey@dos.cafe>",
    "Victor Koenders <bincode@trangar.com>",
]
edition = "2021"
rust-version = "1.85.0"
license = "MIT"
description = "Encoding and explicit untrusted decoding derives for GroveDB's bincode fork"
repository = "https://github.com/dashpay/grovedb"
documentation = "https://docs.rs/grovedb-bincode-derive"
readme = "GROVEDB.md"
categories = ["encoding", "network-programming"]
keywords = ["binary", "encode", "decode", "serialize", "deserialize"]

[lib]
name = "bincode_derive"
proc-macro = true

[dependencies]
virtue = "0.0.18"

# Retain allowances for warnings in the imported upstream generator.
[lints.rust]
mismatched_lifetime_syntaxes = "allow"

[package.metadata.upstream]
package = "bincode_derive"
version = "2.0.1"
archive-sha256 = "bf95709a440f45e986983918d0e8a1f30a9b1df04918fc828670606804ac3c09"
