[package]
name = "lignin-tools"
description = "The lignin command: inspect, verify, compact and migrate LigninDB databases"
version = "7.0.0"
edition = "2024"
license = "MIT"
homepage = "https://www.grovedb.org"
repository = "https://github.com/dashpay/grovedb"
publish = false

[[bin]]
name = "lignin"
path = "src/main.rs"

[dependencies]
lignin-format = { version = "7.0.0", path = "../lignin-format" }
lignin-io = { version = "7.0.0", path = "../lignin-io" }
lignin-store = { version = "7.0.0", path = "../lignin-store" }
lignin-tree = { version = "7.0.0", path = "../lignin-tree" }
lignindb = { version = "7.0.0", path = "../lignindb" }
# Merk's hash rules, by which `lignin verify` makes every stored hash
# again. Merk on LigninDB alone: no RocksDB is built for the command.
grovedb-merk = { version = "7.0.0", path = "../merk", default-features = false, features = ["lignin_storage"] }
grovedb-version = { version = "7.0.0", path = "../grovedb-version" }

[dev-dependencies]
tempfile = { workspace = true }
# Elements as GroveDB serializes them, for the databases of the tests.
grovedb-element = { version = "7.0.0", path = "../grovedb-element" }
