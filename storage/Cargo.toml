[package]
name = "grovedb-storage"
version = "6.0.0"
edition = "2024"
license = "MIT"
description = "Storage extension crate for GroveDB"
homepage = "https://www.grovedb.org/"
documentation = "https://docs.rs/grovedb-storage"
repository = "https://github.com/dashpay/grovedb"

[dependencies]
grovedb-costs = { version = "6.0.0", path = "../costs" }
grovedb-path = { version = "6.0.0", path = "../path" }
grovedb-visualize = { version = "6.0.0", path = "../visualize" }

blake3 = { workspace = true, optional = true }
hex = { workspace = true }
integer-encoding = { workspace = true, optional = true }
lazy_static = { version = "1.5.0", optional = true }
num_cpus = { workspace = true, optional = true }
rocksdb = { version = "0.25.0", optional = true }
strum = { version = "0.28.0", features = ["derive"] }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true }

[features]
rocksdb_storage = ["rocksdb", "num_cpus", "lazy_static", "tempfile", "blake3", "integer-encoding"]
# See `grovedb`'s `unsafe-dump-load` feature for context. On this crate it
# gates `RocksDbStorage::ingest_subtree_sst` — the RocksDB IngestExternalFile
# wrapper used to bulk-load a precomputed subtree SST.
unsafe-dump-load = ["rocksdb_storage"]
