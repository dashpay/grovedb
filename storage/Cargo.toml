[package]
name = "grovedb-storage"
version = "6.1.1"
edition = "2024"
license = "MIT"
description = "Storage extension crate for GroveDB"
homepage = "https://www.grovedb.org/"
documentation = "https://docs.rs/grovedb-storage"
repository = "https://github.com/dashpay/grovedb"

[dependencies]
grovedb-costs = { version = "6.1.1", path = "../costs" }
grovedb-path = { version = "6.1.1", path = "../path" }
grovedb-visualize = { version = "6.1.1", path = "../visualize" }

blake3 = { workspace = true }
hex = { workspace = true }
integer-encoding = { workspace = true, optional = true }
lazy_static = { version = "1.5.0", optional = true }
num_cpus = { workspace = true, optional = true }
rocksdb = { version = "0.25.0", optional = true }
strum = { version = "0.28.0", features = ["derive"] }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
grovedb-costs = { version = "6.1.1", path = "../costs", features = ["cost-model-ledger"] }
syn = { version = "2", features = ["full", "visit"] }

[features]
# `blake3` was an optional dependency, which made this a feature. The crate
# always depends on it now, and the name stays for a manifest that asks for it.
blake3 = []
rocksdb_storage = ["rocksdb", "num_cpus", "lazy_static", "tempfile", "integer-encoding"]
# See `grovedb`'s `unsafe-dump-load` feature for context. On this crate it
# gates `RocksDbStorage::ingest_subtree_sst` — the RocksDB IngestExternalFile
# wrapper used to bulk-load a precomputed subtree SST. It names no engine:
# without `rocksdb_storage` it compiles nothing.
unsafe-dump-load = []
