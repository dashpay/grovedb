[package]
name = "lignindb"
description = "LigninDB storage engine: transactions, snapshots, savepoints, checkpoints and verify"
version = "6.1.1"
edition = "2024"
license = "MIT"
homepage = "https://www.grovedb.org"
repository = "https://github.com/dashpay/grovedb"
publish = false

[dependencies]
lignin-format = { version = "6.1.1", path = "../lignin-format" }
lignin-store = { version = "6.1.1", path = "../lignin-store" }
lignin-tree = { version = "6.1.1", path = "../lignin-tree" }
lignin-io = { version = "6.1.1", path = "../lignin-io" }
tempfile = { workspace = true, optional = true }

[features]
# A test fixture, and no API: the store on disk of this crate's own tests
# (`txn::testing`), for the tests of crates that build on a write transaction
# before the engine can be opened. It is switched on from `[dev-dependencies]`
# only, and no other feature turns it on. The engine facade (TXN-07) replaces
# it.
testing = ["dep:tempfile"]

[target.'cfg(loom)'.dependencies]
loom = "0.7.2"

[dev-dependencies]
lignin-io = { version = "6.1.1", path = "../lignin-io" }
tempfile = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
