[package]
name = "grovedb-bincode"
version = "2.0.2"
authors = [
    "Ty Overby <ty@pre-alpha.com>",
    "Zoey Riordan <zoey@dos.cafe>",
    "Victor Koenders <bincode@trangar.com>",
]
rust-version = "1.85.0"
edition = "2021"
license = "MIT"
description = "GroveDB's maintained fork of bincode binary serialization"
repository = "https://github.com/dashpay/grovedb"
documentation = "https://docs.rs/grovedb-bincode"
readme = "GROVEDB.md"
categories = ["encoding", "network-programming"]
keywords = ["binary", "encode", "decode", "serialize", "deserialize"]

# Preserve the upstream crate name, derive paths, tests, and documentation.
[lib]
name = "bincode"

[features]
default = ["std", "derive"]
std = ["alloc", "serde?/std"]
alloc = ["serde?/alloc"]
derive = ["bincode_derive"]

[dependencies]
bincode_derive = { package = "grovedb-bincode-derive", path = "../grovedb-bincode-derive", version = "=2.0.1", optional = true }
serde = { version = "1.0", default-features = false, optional = true }
unty = "0.0.4"

[dev-dependencies]
ouroboros = "0.18.3"
serde_derive = "1.0"
serde_json = { version = "1.0", default-features = false }
tempfile = "3.2"
criterion = "0.5"
rand = "0.8"
uuid = { version = "1.1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
glam = { version = "0.25", features = ["serde"] }
bincode_1 = { version = "1.3", package = "bincode" }
bincode_upstream = { version = "=2.0.1", package = "bincode", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
bumpalo = { version = "3.16.0", features = ["collections"] }

[[bench]]
name = "varint"
harness = false

[[bench]]
name = "inline"
harness = false

[[bench]]
name = "string"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Allow existing upstream warnings and compile-only test fixtures.
[lints.rust]
deprecated = "allow"
mismatched_lifetime_syntaxes = "allow"
dead_code = "allow"

[package.metadata.upstream]
package = "bincode"
version = "2.0.1"
archive-sha256 = "36eaf5d7b090263e8150820482d5d93cd964a81e4019913c972f4edcc6edb740"
git-revision = "4673360aa638b2b907dff24538de54f258d157da"
