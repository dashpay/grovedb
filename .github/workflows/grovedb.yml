name: GroveDB

on:
  workflow_dispatch:
  push:
    branches: [master, develop]
  pull_request:
    branches:
      - master
      - develop
      - 'v[0-9]+.[0-9]+-dev'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      any-code: ${{ steps.filter.outputs.any-code }}
      needs-tests: ${{ steps.decide.outputs.needs-tests }}
      bincode: ${{ steps.filter.outputs.bincode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            any-code:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
            build-files:
              - '**/Cargo.toml'
              - 'Cargo.lock'
            bincode:
              - 'grovedb-bincode/**'
              - 'grovedb-bincode-derive/**'
      - name: Check if Rust changes are doc-comment-only
        id: doc-check
        if: >-
          steps.filter.outputs.any-code == 'true'
          && steps.filter.outputs.build-files == 'false'
          && github.event_name == 'pull_request'
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          # Extract added/removed lines from .rs diffs, strip +/- prefix and leading whitespace
          CHANGED=$(git diff "$BASE"...HEAD -- '*.rs' | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | sed 's/^[+-]//' | sed 's/^[[:space:]]*//')
          # Check if any changed line is NOT a doc comment or blank
          NON_DOC=$(echo "$CHANGED" | grep -vE '^$|^///|^//!' || true)
          if [ -z "$NON_DOC" ]; then
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Determine if tests are needed
        id: decide
        run: |
          if [[ "${{ steps.doc-check.outputs.docs-only }}" == "true" ]]; then
            echo "needs-tests=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs-tests=${{ steps.filter.outputs.any-code }}" >> "$GITHUB_OUTPUT"
          fi

  # Run tests sharded on Ubuntu
  test-ubuntu:
    name: Test Ubuntu (${{ matrix.partition }}/3)
    needs: detect-changes
    if: needs.detect-changes.outputs.needs-tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "false"
          workspaces: ". -> target/llvm-cov-target"
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@cargo-nextest
      - name: Run tests (shard ${{ matrix.partition }}/3)
        # --exclude removes the imported crates from both tests and coverage.
        # Their own checks run in the bincode job only when their files change.
        run: >
          cargo llvm-cov nextest
          --workspace
          --exclude grovedb-bincode
          --exclude grovedb-bincode-derive
          --all-features
          --partition count:${{ matrix.partition }}/3
          --lcov --output-path lcov.info
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          # Each test shard runs a disjoint 1/3 of the suite, so its
          # lcov only covers the lines its tests exercised. Tag each
          # upload with a distinct flag so codecov computes the commit
          # total/patch coverage as the UNION across flags (with
          # carryforward in .codecov.yml). Without distinct flags codecov
          # does not reliably union per-file line hits across multiple
          # unflagged same-commit uploads, which under-reports patch
          # coverage for lines covered by only one shard.
          flags: shard-${{ matrix.partition }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  linting:
    name: Linting
    needs: detect-changes
    if: needs.detect-changes.outputs.any-code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "false"
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Run clippy
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
        run: >
          cargo clippy --workspace
          --exclude grovedb-bincode --exclude grovedb-bincode-derive
          --all-features --no-deps -- -D warnings
      # Benches and other non-lib targets are not built by the clippy or test
      # steps, so a rename can leave a registered bench target uncompilable
      # without any job noticing. Type-check every target (no -D warnings
      # here — this step is about compile breakage, not lints).
      - name: Check all targets build
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
        run: >
          cargo check --workspace
          --exclude grovedb-bincode --exclude grovedb-bincode-derive
          --all-features --all-targets
      - name: Check verify feature
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
        run: cargo build --no-default-features --features verify -p grovedb

  formatting:
    name: Formatting
    needs: detect-changes
    if: needs.detect-changes.outputs.any-code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check workspace formatting
        # cargo fmt has no --exclude; select workspace packages explicitly.
        run: |
          package_names=$(cargo metadata --no-deps --format-version 1 | jq -r '
            .packages[].name
            | select(. != "grovedb-bincode" and . != "grovedb-bincode-derive")
          ')
          packages=()
          while IFS= read -r package; do
            packages+=(-p "$package")
          done <<< "$package_names"
          cargo fmt "${packages[@]}" --check

  bincode:
    name: Bincode
    needs: detect-changes
    if: needs.detect-changes.outputs.bincode == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "false"
      - name: Run upstream and compatibility tests
        run: cargo test -p grovedb-bincode -p grovedb-bincode-derive --all-features
      - name: Run clippy on all targets
        run: >
          cargo clippy -p grovedb-bincode -p grovedb-bincode-derive
          --all-features --all-targets --no-deps -- -D warnings
      - name: Check formatting
        run: cargo fmt -p grovedb-bincode -p grovedb-bincode-derive --check
      - name: Check no-std feature combinations
        run: |
          cargo check -p grovedb-bincode --no-default-features
          cargo check -p grovedb-bincode --no-default-features --features alloc,derive
          cargo check -p grovedb-bincode --no-default-features --features alloc,serde

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
