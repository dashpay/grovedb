name: GroveDB

on:
  workflow_dispatch:
  push:
    branches: [master, develop]
  pull_request:
    branches:
      - master
      - develop
      - 'v[0-9]+.[0-9]+-dev'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Where the jobs run
#
# Every job runs on a GitHub-hosted runner unless a variable names another
# pool. Both variables are unset by default.
#
# - RUST_CI_RUNNER_LABELS: the labels of the organisation's self-hosted Rust
#   runners, as a JSON list, for example ["self-hosted","Linux","rust-ci"].
#   The test shards, Linting, Formatting and Bincode then run there.
# - GROVEDB_LIGHT_RUNNER: the label of the organisation's light runner pool.
#   Detect Changes then runs there.
#
# Those runners are persistent, so they never run a pull request from a fork:
# such a pull request stays on GitHub-hosted runners whatever the variables
# say. The steps below that install tools or restore caches run only on a
# hosted runner (runner.environment == 'github-hosted'); a self-hosted runner
# takes its tools from its image and keeps target/ between jobs, see
# .github/actions/persistent-runner.

jobs:
  detect-changes:
    name: Detect Changes
    # The other jobs wait for this one. It only reads the diff, with
    # tools every runner image has (git, grep, sed).
    runs-on: >-
      ${{ (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
      && vars.GROVEDB_LIGHT_RUNNER || 'ubuntu-latest' }}
    outputs:
      any-code: ${{ steps.filter.outputs.any-code }}
      needs-tests: ${{ steps.decide.outputs.needs-tests }}
      bincode: ${{ steps.filter.outputs.bincode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # A change to this workflow or to the action it uses runs every job,
          # so the change is exercised before it merges.
          filters: |
            any-code:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/grovedb.yml'
              - '.github/actions/**'
            build-files:
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/grovedb.yml'
              - '.github/actions/**'
            bincode:
              - 'grovedb-bincode/**'
              - 'grovedb-bincode-derive/**'
              - '.github/workflows/grovedb.yml'
              - '.github/actions/**'
      - name: Check if Rust changes are doc-comment-only
        id: doc-check
        if: >-
          steps.filter.outputs.any-code == 'true'
          && steps.filter.outputs.build-files == 'false'
          && github.event_name == 'pull_request'
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          # Extract added/removed lines from .rs diffs, strip +/- prefix and leading whitespace
          CHANGED=$(git diff "$BASE"...HEAD -- '*.rs' | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | sed 's/^[+-]//' | sed 's/^[[:space:]]*//')
          # Check if any changed line is NOT a doc comment or blank
          NON_DOC=$(echo "$CHANGED" | grep -vE '^$|^///|^//!' || true)
          if [ -z "$NON_DOC" ]; then
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Determine if tests are needed
        id: decide
        run: |
          if [[ "${{ steps.doc-check.outputs.docs-only }}" == "true" ]]; then
            echo "needs-tests=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs-tests=${{ steps.filter.outputs.any-code }}" >> "$GITHUB_OUTPUT"
          fi

  # Run tests sharded on Ubuntu
  test-ubuntu:
    name: Test Ubuntu (${{ matrix.partition }}/3)
    needs: detect-changes
    if: needs.detect-changes.outputs.needs-tests == 'true'
    runs-on: >-
      ${{ fromJSON((github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
      && vars.RUST_CI_RUNNER_LABELS || '"ubuntu-latest"') }}
    # A stuck job must not hold a self-hosted runner for the six hours a
    # job may run by default (360 minutes, the value kept while the variable
    # is unset).
    timeout-minutes: ${{ vars.RUST_CI_RUNNER_LABELS && 60 || 360 }}
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Keep target/ on a self-hosted runner. A hosted runner starts
          # with an empty work directory, where this changes nothing.
          clean: false
      - name: Prepare a persistent runner
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/persistent-runner
        with:
          tools: clang cmake cargo-llvm-cov cargo-nextest
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          cache-on-failure: "false"
          workspaces: ". -> target/llvm-cov-target"
      - uses: taiki-e/install-action@cargo-llvm-cov
        if: runner.environment == 'github-hosted'
      - uses: taiki-e/install-action@cargo-nextest
        if: runner.environment == 'github-hosted'
      - name: Run tests (shard ${{ matrix.partition }}/3)
        # --exclude removes the imported crates from both tests and coverage.
        # Their own checks run in the bincode job only when their files change.
        run: >
          cargo llvm-cov nextest
          --workspace
          --exclude grovedb-bincode
          --exclude grovedb-bincode-derive
          --all-features
          --partition count:${{ matrix.partition }}/3
          --lcov --output-path lcov.info
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          # Each test shard runs a disjoint 1/3 of the suite, so its
          # lcov only covers the lines its tests exercised. Tag each
          # upload with a distinct flag so codecov computes the commit
          # total/patch coverage as the UNION across flags (with
          # carryforward in .codecov.yml). Without distinct flags codecov
          # does not reliably union per-file line hits across multiple
          # unflagged same-commit uploads, which under-reports patch
          # coverage for lines covered by only one shard.
          flags: shard-${{ matrix.partition }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          # `files` adds to what the uploader finds by searching. A kept
          # target/ is large and holds other builds' output, so a self-hosted
          # runner uploads lcov.info alone and runs no report plugins.
          disable_search: ${{ runner.environment == 'self-hosted' }}
          plugins: ${{ runner.environment == 'self-hosted' && 'noop' || '' }}
      # The instrumented build stays in target/llvm-cov-target for the next
      # job; the profile data of this run does not.
      - name: Remove per-run coverage profile data
        if: always() && runner.environment == 'self-hosted'
        run: |
          if [ -d target/llvm-cov-target ]; then
            find target/llvm-cov-target \( -name '*.profraw' -o -name '*.profdata' \) -delete || true
            du -sh target/llvm-cov-target || true
          fi

  linting:
    name: Linting
    needs: detect-changes
    if: needs.detect-changes.outputs.any-code == 'true'
    runs-on: >-
      ${{ fromJSON((github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
      && vars.RUST_CI_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: ${{ vars.RUST_CI_RUNNER_LABELS && 30 || 360 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          clean: false
      - name: Prepare a persistent runner
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/persistent-runner
        with:
          tools: clang cmake
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          cache-on-failure: "false"
      # sccache stores its objects in the GitHub cache. A self-hosted runner
      # keeps target/ instead, so the steps below run cargo without a wrapper
      # there (an empty RUSTC_WRAPPER means none).
      - uses: mozilla-actions/sccache-action@v0.0.9
        if: runner.environment == 'github-hosted'
      - name: Run clippy
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: ${{ runner.environment == 'github-hosted' && 'sccache' || '' }}
        run: >
          cargo clippy --workspace
          --exclude grovedb-bincode --exclude grovedb-bincode-derive
          --all-features --no-deps -- -D warnings
      # Benches and other non-lib targets are not built by the clippy or test
      # steps, so a rename can leave a registered bench target uncompilable
      # without any job noticing. Type-check every target (no -D warnings
      # here — this step is about compile breakage, not lints).
      - name: Check all targets build
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: ${{ runner.environment == 'github-hosted' && 'sccache' || '' }}
        run: >
          cargo check --workspace
          --exclude grovedb-bincode --exclude grovedb-bincode-derive
          --all-features --all-targets
      - name: Check verify feature
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: ${{ runner.environment == 'github-hosted' && 'sccache' || '' }}
        run: cargo build --no-default-features --features verify -p grovedb

  formatting:
    name: Formatting
    needs: detect-changes
    if: needs.detect-changes.outputs.any-code == 'true'
    runs-on: >-
      ${{ fromJSON((github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
      && vars.RUST_CI_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: ${{ vars.RUST_CI_RUNNER_LABELS && 30 || 360 }}
    steps:
      - uses: actions/checkout@v4
        with:
          # This job builds nothing, but it shares the work directory with
          # the jobs that keep target/ there.
          clean: false
      - name: Prepare a persistent runner
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/persistent-runner
        with:
          tools: jq
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check workspace formatting
        # cargo fmt has no --exclude; select workspace packages explicitly.
        run: |
          package_names=$(cargo metadata --no-deps --format-version 1 | jq -r '
            .packages[].name
            | select(. != "grovedb-bincode" and . != "grovedb-bincode-derive")
          ')
          packages=()
          while IFS= read -r package; do
            packages+=(-p "$package")
          done <<< "$package_names"
          cargo fmt "${packages[@]}" --check

  bincode:
    name: Bincode
    needs: detect-changes
    if: needs.detect-changes.outputs.bincode == 'true'
    runs-on: >-
      ${{ fromJSON((github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
      && vars.RUST_CI_RUNNER_LABELS || '"ubuntu-latest"') }}
    timeout-minutes: ${{ vars.RUST_CI_RUNNER_LABELS && 30 || 360 }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Prepare a persistent runner
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/persistent-runner
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          cache-on-failure: "false"
      - name: Run upstream and compatibility tests
        run: cargo test -p grovedb-bincode -p grovedb-bincode-derive --all-features
      - name: Run clippy on all targets
        run: >
          cargo clippy -p grovedb-bincode -p grovedb-bincode-derive
          --all-features --all-targets --no-deps -- -D warnings
      - name: Check formatting
        run: cargo fmt -p grovedb-bincode -p grovedb-bincode-derive --check
      - name: Check no-std feature combinations
        run: |
          cargo check -p grovedb-bincode --no-default-features
          cargo check -p grovedb-bincode --no-default-features --features alloc,derive
          cargo check -p grovedb-bincode --no-default-features --features alloc,serde

  security:
    name: Security Audit
    # Stays hosted: it installs cargo-audit on every run and takes seconds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
