[package]
name = "grovedb-costs"
version = "6.1.1"
edition = "2024"
license = "MIT"
description = "Costs extension crate for GroveDB"
homepage = "https://www.grovedb.org/"
documentation = "https://docs.rs/grovedb-costs"
repository = "https://github.com/dashpay/grovedb"


[dependencies]
thiserror = { workspace = true }
intmap = { workspace = true }
integer-encoding = { workspace = true }

[features]
# Adds up, per thread, every cost the cost model hands out, so that a test
# can hold an engine to it. For tests only.
cost-model-ledger = []
