[package]
name = "grovedb"
description = "Fully featured database using balanced hierarchical authenticated data structures"
version = "5.0.1"
authors = [
    "Samuel Westrich <sam@dash.org>",
    "Wisdom Ogwu <wisdom@dash.org>",
    "Evgeny Fomin <evgeny.fomin@dash.org>",
]
edition = "2024"
license = "MIT"
homepage = "https://www.grovedb.org"
repository = "https://github.com/dashpay/grovedb"
readme = "../README.md"
documentation = "https://docs.rs/grovedb"

[dependencies]
grovedb-costs = { version = "5.0.1", path = "../costs", optional = true }
grovedbg-types = { version = "5.0.1", path = "../grovedbg-types", optional = true }
grovedb-merk = { version = "5.0.1", path = "../merk", optional = true, default-features = false }
grovedb-path = { version = "5.0.1", path = "../path" }
grovedb-storage = { version = "5.0.1", path = "../storage", optional = true }
grovedb-version = { version = "5.0.1", path = "../grovedb-version" }
grovedb-visualize = { version = "5.0.1", path = "../visualize", optional = true }
grovedb-element = { version = "5.0.1", path = "../grovedb-element" }
grovedb-commitment-tree = { version = "5.0.1", path = "../grovedb-commitment-tree", optional = true }
grovedb-merkle-mountain-range = { version = "5.0.1", path = "../grovedb-merkle-mountain-range", optional = true, default-features = false }
grovedb-bulk-append-tree = { version = "5.0.1", path = "../grovedb-bulk-append-tree", optional = true, default-features = false }
grovedb-private-document-store = { version = "5.0.1", path = "../grovedb-private-document-store", optional = true, default-features = false }
grovedb-dense-fixed-sized-merkle-tree = { version = "5.0.1", path = "../grovedb-dense-fixed-sized-merkle-tree", optional = true, default-features = false }
grovedb-query = { version = "5.0.1", path = "../grovedb-query" }

axum = { workspace = true, optional = true }
bincode = { workspace = true }
bincode_derive = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
indexmap = { workspace = true }
integer-encoding = { workspace = true, optional = true }
intmap = { workspace = true, optional = true }
itertools = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "net",
], optional = true }
tower-http = { workspace = true, optional = true }
zip-extensions = { version = "0.13.0", optional = true }
serde = { workspace = true, optional = true }
bitvec = { workspace = true, optional = true }

[dev-dependencies]
grovedb-epoch-based-storage-flags = { version = "5.0.1", path = "../grovedb-epoch-based-storage-flags" }

criterion = { workspace = true }
hex = { workspace = true }
pretty_assertions = "1.4.0"
rand = { workspace = true }
rand_distr = "0.6"
assert_matches = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync"] }
# For the `unsafe-dump-load` dump+ingest roundtrip test: writing the SST and
# ingesting it both need direct rocksdb types. Pinned to the same revision
# used by `grovedb-storage`'s optional dep.
rocksdb = { git = "https://github.com/QuantumExplorer/rust-rocksdb.git", rev = "52772eea7bcd214d1d07d80aa538b1d24e5015b7" }

[[bench]]
name = "insertion_benchmark"
harness = false

[[bench]]
name = "proof_generation_benchmark"
harness = false

[[bench]]
name = "branch_chunk_queries"
harness = false

[[bench]]
name = "cidx_benchmark"
harness = false

[[bench]]
name = "bulk_range_scan_benchmark"
harness = false

[features]
default = ["full", "estimated_costs"]
proof_debug = ["grovedb-merk/proof_debug"]
serde = ["dep:serde", "grovedb-merk/serde", "grovedb-query/serde", "indexmap/serde"]
full = ["grovedb-merk/full", "minimal"]
minimal = [
    "bitvec",
    "grovedb-merk/minimal",
    "grovedb-commitment-tree",
    "grovedb-commitment-tree/server",
    "grovedb-merkle-mountain-range",
    "grovedb-merkle-mountain-range/storage",
    "grovedb-bulk-append-tree",
    "grovedb-bulk-append-tree/storage",
    "grovedb-private-document-store",
    "grovedb-private-document-store/storage",
    "grovedb-dense-fixed-sized-merkle-tree",
    "grovedb-dense-fixed-sized-merkle-tree/storage",
    "thiserror",
    "tempfile",
    "grovedb-storage/rocksdb_storage",
    "visualize",
    "itertools",
    "integer-encoding",
    "grovedb-costs",
    "intmap",
]
visualize = ["grovedb-visualize"]
verify = [
    "grovedb-merk/verify",
    "grovedb-costs",
    "thiserror",
    "integer-encoding",
    "grovedb-merkle-mountain-range",
    "grovedb-bulk-append-tree",
    "grovedb-dense-fixed-sized-merkle-tree",
]
estimated_costs = ["full"]
zk_client = ["grovedb-commitment-tree", "grovedb-commitment-tree/client"]
grovedbg = [
    "dep:hex-literal",
    "dep:reqwest",
    "dep:sha2",
    "grovedbg-types",
    "tokio",
    "tokio-util",
    "full",
    "grovedb-merk/grovedbg",
    "axum",
    "tower-http",
    "zip-extensions",
    "tempfile",
]
# Snapshot-bootstrap primitives — escape hatches that bypass grovedb's normal
# validation:
#  - `GroveDb::raw_storage`            (escape hatch to StorageContext)
#  - `RocksDbStorage::ingest_subtree_sst` (bulk-load SST into a CF)
#  - `GroveDb::replace_subtree_root`   (caller-provided child hash, no
#                                       cross-check against actual subtree state)
# Enable ONLY for build-time tooling that needs to dump+restore a subtree
# out-of-band (e.g. devnet shielded-pool snapshot bake/apply). Misuse will
# produce an inconsistent Merk tree — there is no runtime check that the
# caller-provided hash matches the underlying state.
unsafe-dump-load = ["grovedb-storage/unsafe-dump-load"]

[build-dependencies]
hex-literal = { version = "1.1.0", optional = true }
reqwest = { version = "0.13", features = ["blocking"], optional = true }
sha2 = { version = "0.10.8", optional = true }
