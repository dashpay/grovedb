[package]
name = "grovedb"
description = "Fully featured database using balanced hierarchical authenticated data structures"
version = "7.0.0"
authors = [
    "Samuel Westrich <sam@dash.org>",
    "Wisdom Ogwu <wisdom@dash.org>",
    "Evgeny Fomin <evgeny.fomin@dash.org>",
]
edition = "2024"
license = "MIT"
homepage = "https://www.grovedb.org"
repository = "https://github.com/dashpay/grovedb"
readme = "../README.md"
documentation = "https://docs.rs/grovedb"

[dependencies]
grovedb-costs = { version = "7.0.0", path = "../costs", optional = true }
grovedbg-types = { version = "7.0.0", path = "../grovedbg-types", optional = true }
grovedb-merk = { version = "7.0.0", path = "../merk", optional = true, default-features = false }
grovedb-path = { version = "7.0.0", path = "../path" }
grovedb-storage = { version = "7.0.0", path = "../storage", optional = true }
grovedb-version = { version = "7.0.0", path = "../grovedb-version" }
grovedb-visualize = { version = "7.0.0", path = "../visualize", optional = true }
grovedb-element = { version = "7.0.0", path = "../grovedb-element" }
grovedb-commitment-tree = { version = "7.0.0", path = "../grovedb-commitment-tree", optional = true }
grovedb-merkle-mountain-range = { version = "7.0.0", path = "../grovedb-merkle-mountain-range", optional = true, default-features = false }
grovedb-bulk-append-tree = { version = "7.0.0", path = "../grovedb-bulk-append-tree", optional = true, default-features = false }
grovedb-private-document-store = { version = "7.0.0", path = "../grovedb-private-document-store", optional = true, default-features = false }
grovedb-dense-fixed-sized-merkle-tree = { version = "7.0.0", path = "../grovedb-dense-fixed-sized-merkle-tree", optional = true, default-features = false }
grovedb-query = { version = "7.0.0", path = "../grovedb-query" }
lignindb = { version = "7.0.0", path = "../lignindb", optional = true }
lignin-tree = { version = "7.0.0", path = "../lignin-tree", optional = true }
# The file layer of LigninDB, which `lignindb::Options` takes. The tests of
# the engine fail file operations on its simulated one. It is named here and
# not among the dev-dependencies, so that a build with no engine has no
# LigninDB crate in its tests either.
lignin-io = { version = "7.0.0", path = "../lignin-io", optional = true }

axum = { workspace = true, optional = true }
bincode = { workspace = true }
bincode_derive = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
indexmap = { workspace = true }
integer-encoding = { workspace = true, optional = true }
intmap = { workspace = true, optional = true }
itertools = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "net",
], optional = true }
tower-http = { workspace = true, optional = true }
zip = { version = "9.0.5", optional = true, default-features = false, features = ["deflate"] }
serde = { workspace = true, optional = true }

[dev-dependencies]
grovedb-epoch-based-storage-flags = { version = "7.0.0", path = "../grovedb-epoch-based-storage-flags" }

criterion = { workspace = true }
hex = { workspace = true }
# Process RSS sampling for the `#[ignore]`d state-sync restore
# memory-ceiling harness (`tests/replication_scale_tests.rs`). The memory
# that harness measures lives in RocksDB's C++ `WriteBatchWithIndex`, so it
# has to be read from the OS rather than from a Rust allocator hook.
libc = "0.2"
pretty_assertions = "1.4.0"
# Adversarial-input properties for the untrusted state-sync decode
# surfaces (`tests/replication_fuzz_tests.rs`).
proptest = "1.10.0"
rand = { workspace = true }
rand_distr = "0.6"
assert_matches = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync"] }

[[bench]]
name = "insertion_benchmark"
harness = false
required-features = ["rocksdb_storage"]

[[bench]]
name = "proof_generation_benchmark"
harness = false
required-features = ["rocksdb_storage"]

[[bench]]
name = "branch_chunk_queries"
harness = false
required-features = ["rocksdb_storage"]

[[bench]]
name = "cidx_benchmark"
harness = false
required-features = ["rocksdb_storage"]

[[bench]]
name = "bulk_range_scan_benchmark"
harness = false
required-features = ["rocksdb_storage"]

[features]
default = ["full", "estimated_costs"]
proof_debug = ["grovedb-merk/proof_debug"]
serde = ["dep:serde", "grovedb-merk/serde", "grovedb-query/serde", "indexmap/serde"]
full = ["grovedb-merk/full", "minimal"]
# GroveDB on RocksDB, its default engine.
minimal = ["engine_generic", "rocksdb_storage"]
# The RocksDB engine: `RocksDbEngine`, which `GroveDb` with no engine named
# is on, and with it `GroveDb::open`.
rocksdb_storage = [
    "engine_generic",
    "grovedb-storage/rocksdb_storage",
    "grovedb-merk/rocksdb_storage",
]
# The LigninDB engine: `LigninEngine` (`grovedb::engine::lignin`). It is in
# no other feature and not among the defaults: a build that does not ask for
# it has none of the LigninDB crates. With this feature and without
# `rocksdb_storage`, `GroveDb` with no engine named is on LigninDB.
lignin_storage = [
    "engine_generic",
    "grovedb-merk/lignin_storage",
    "dep:lignindb",
    "dep:lignin-tree",
    "dep:lignin-io",
]
# Everything of GroveDB that is written for any storage engine: `GroveDb<E>`
# and its operations, batches, proofs and state sync, and the estimated
# costs. It compiles no engine. See `docs/lignindb/engine.md`.
engine_generic = [
    "grovedb-merk/minimal",
    "grovedb-commitment-tree",
    "grovedb-commitment-tree/server",
    "grovedb-merkle-mountain-range",
    "grovedb-merkle-mountain-range/storage",
    "grovedb-bulk-append-tree",
    "grovedb-bulk-append-tree/storage",
    "grovedb-private-document-store",
    "grovedb-private-document-store/storage",
    "grovedb-dense-fixed-sized-merkle-tree",
    "grovedb-dense-fixed-sized-merkle-tree/storage",
    "thiserror",
    "tempfile",
    "grovedb-storage",
    "visualize",
    "itertools",
    "integer-encoding",
    "grovedb-costs",
    "intmap",
]
visualize = ["grovedb-visualize"]
verify = [
    "grovedb-merk/verify",
    "grovedb-costs",
    "thiserror",
    "integer-encoding",
    "grovedb-merkle-mountain-range",
    "grovedb-bulk-append-tree",
    "grovedb-dense-fixed-sized-merkle-tree",
    "grovedb-private-document-store",
]
# The estimates are functions of sizes and of the cost model, so they need no
# engine. `colored_debug` is what this feature turned on in Merk while it was
# `full`, kept for a build that has `minimal` and this and not `full`.
estimated_costs = ["engine_generic", "grovedb-merk/colored_debug"]
zk_client = ["grovedb-commitment-tree", "grovedb-commitment-tree/client"]
grovedbg = [
    "dep:hex-literal",
    "dep:reqwest",
    "dep:sha2",
    "grovedbg-types",
    "tokio",
    "tokio-util",
    "full",
    "grovedb-merk/grovedbg",
    "axum",
    "tower-http",
    "zip",
    "tempfile",
    "bincode/serde",
]
# Snapshot-bootstrap primitives — escape hatches that bypass grovedb's normal
# validation:
#  - `GroveDb::dump_subtree`, `GroveDb::load_subtree` (the records of one
#                                       subtree to and from a stream, on any
#                                       engine; `docs/lignindb/engine.md`)
#  - `GroveDb::subtree_root_as`        (the root a subtree's records give)
#  - `GroveDb::replace_subtree_root`   (caller-provided child hash, no
#                                       cross-check against actual subtree state)
# and, where the RocksDB engine is compiled in (`rocksdb_storage`):
#  - `GroveDb::raw_storage`            (escape hatch to StorageContext)
#  - `RocksDbStorage::ingest_subtree_sst` (bulk-load SST into a CF)
# The feature names no engine: it adds the hatches to the engines of the
# build.
# Enable ONLY for build-time tooling that needs to dump+restore a subtree
# out-of-band (e.g. devnet shielded-pool snapshot bake/apply). Misuse will
# produce an inconsistent Merk tree — there is no runtime check that the
# caller-provided hash matches the underlying state.
unsafe-dump-load = ["engine_generic", "grovedb-storage/unsafe-dump-load"]

# `lignin_cost_model` is set where `lignin-testkit/cost-model-storage/check.sh`
# builds GroveDB on a storage crate that has no RocksDB.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(lignin_cost_model)'] }

[build-dependencies]
hex-literal = { version = "1.1.0", optional = true }
reqwest = { version = "0.13", features = ["blocking"], optional = true }
sha2 = { version = "0.10.8", optional = true }
