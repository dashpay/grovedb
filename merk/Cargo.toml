[package]
name = "grovedb-merk"
description = "Merkle key/value store adapted for GroveDB"
version = "6.1.1"
authors = [
        "Samuel Westrich <sam@dash.org>",
        "Wisdom Ogwu <wisdom@dash.org>",
        "Evgeny Fomin <evgeny.fomin@dash.org>",
        "Matt Bell <mappum@gmail.com>",
]
edition = "2024"
license = "MIT"
homepage = "https://www.grovedb.org"
repository = "https://github.com/dashpay/grovedb"
readme = "README.md"
documentation = "https://docs.rs/grovedb-merk"

[dependencies]
grovedb-costs = { version = "6.1.1", path = "../costs" }
grovedb-path = { version = "6.1.1", path = "../path" }
grovedb-storage = { version = "6.1.1", path = "../storage", optional = true }
grovedb-version = { version = "6.1.1", path = "../grovedb-version" }
grovedb-visualize = { version = "6.1.1", path = "../visualize" }
grovedb-element = { version = "6.1.1", path = "../grovedb-element" }
grovedb-query = { version = "6.1.1", path = "../grovedb-query" }
lignindb = { version = "6.1.1", path = "../lignindb", optional = true }
lignin-format = { version = "6.1.1", path = "../lignin-format", optional = true }
lignin-tree = { version = "6.1.1", path = "../lignin-tree", optional = true }

bincode = { workspace = true }
bincode_derive = { workspace = true }
hex = { workspace = true }
indexmap = { workspace = true }
integer-encoding = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
byteorder = { workspace = true }
blake3 = { workspace = true, optional = true }
ed = { workspace = true, optional = true }
num_cpus = { workspace = true, optional = true }
colored = { version = "3.0.0", optional = true }

[features]
default = ["full"]
proof_debug = []
serde = ["dep:serde", "indexmap/serde"]
# Merk on any `NodeStore`. It compiles no storage engine: `rocksdb_storage`
# does, for the RocksDB contexts a Merk is opened on.
minimal = [
        "num_cpus",
        "ed",
        "blake3",
        "grovedb-storage",
        "grovedb-element/visualize",
        "grovedb-query/blockchain",
]
rocksdb_storage = ["minimal", "grovedb-storage/rocksdb_storage"]
# `store::lignin`: the node store of a Merk on a LigninDB write transaction.
lignin_storage = ["minimal", "dep:lignindb", "dep:lignin-format", "dep:lignin-tree"]
full = ["minimal", "rocksdb_storage", "test_utils", "colored_debug"]
# `test_utils` for other crates, with the engines of the suite that are on
# RocksDB (`merk/test-engines.txt`). The one on LigninDB is compiled where
# `lignin_storage` is on as well.
test_utils = ["rand", "tempfile", "rocksdb_storage"]
colored_debug = ["colored"]
verify = ["ed", "blake3"]
grovedbg = ["full"]

[dev-dependencies]
# The ledger of the cost model, which the tests of `store::lignin` hold the
# store to.
grovedb-costs = { version = "6.1.1", path = "../costs", features = ["cost-model-ledger"] }
# For `test_utils` in a test build that has the feature off.
rand = { workspace = true }
# The file layer under the engine the tests of `store::lignin` open, for the
# test that counts the reads of the value log a proof makes.
lignin-io = { version = "6.1.1", path = "../lignin-io" }
tempfile = { workspace = true }
criterion = { workspace = true }
assert_matches = { workspace = true }

[[bench]]
name = "merk"
harness = false

[[bench]]
name = "ops"
harness = false

[[bench]]
name = "branch_queries"
harness = false

# Heap allocations of a Merk for one state transition, on LigninDB and on
# RocksDB (LigninDB task MERK-08).
[[bench]]
name = "allocations"
harness = false
required-features = ["lignin_storage", "test_utils"]
